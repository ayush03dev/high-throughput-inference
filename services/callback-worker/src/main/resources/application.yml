spring:
  application:
    name: callback-worker
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:inference}
    username: ${POSTGRES_USER:inference}
    password: ${POSTGRES_PASSWORD:inference}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info

inference:
  callback:
    max-attempts: 5
  kafka:
    callbacks-topic: batch.callbacks
    callback-consumer-group: callback-workers
