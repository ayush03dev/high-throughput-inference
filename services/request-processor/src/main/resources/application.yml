spring:
  application:
    name: request-processor
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:inference}
    username: ${POSTGRES_USER:inference}
    password: ${POSTGRES_PASSWORD:inference}
    hikari:
      # RequestProcessor.markInFlight/finalizeRequest each open their own
      # @Transactional DB round trip, and both the primary and retry Kafka
      # consumer groups run inference.kafka.listener-concurrency (32) threads
      # concurrently — the previous default pool size of 10 meant most of
      # those 64 possible concurrent threads were blocked waiting for a
      # connection instead of processing, capping real throughput well below
      # the configured RPM limit. Sized to cover both groups at full
      # concurrency; Postgres's max_connections (100 by default) has room to
      # spare alongside inference-gateway and webhook-delivery's pools.
      maximum-pool-size: ${DB_POOL_SIZE:64}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info

inference:
  provider-url: ${PROVIDER_URL:http://localhost:8082}
  max-queue-wait-ms: 1200000
  kafka:
    requests-topic: inference.requests
    retry-topic: inference.requests.retry
    consumer-group: request-processors
    retry-consumer-group: request-processors-retry
    retry-delay-ms: 50
    listener-concurrency: ${KAFKA_LISTENER_CONCURRENCY:32}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%logger{20}] %msg%n"
  level:
    com.consuma.inference: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
